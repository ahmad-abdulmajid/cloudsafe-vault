  body {
    font-family: Arial, sans-serif;
    background:#eef1f5;
    padding: 40px;
  }
  .card {
    background: white;
    padding: 25px;
    width: 960px;
    margin: auto;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  }
  h2 { margin-bottom: 5px; }
  p { margin-bottom: 15px; }

  .upload-box {
    margin-top: 10px;
    margin-bottom: 16px;
    padding: 15px;
    border-radius: 10px;
    background: #f3f4f6;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: space-between;
  }
  .upload-box input[type="file"] {
    flex: 1;
  }
  .btn-upload {
    background:#2563eb;
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
  }
  .btn-upload:hover { background:#1d4ed8; }

  .upload-status {
    margin-bottom: 18px;
    font-size: 13px;
    color:#4b5563;
  }
  .progress-bar {
    width:100%;
    height:8px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
    margin-top:6px;
  }
  .progress-fill {
    height:100%;
    width:0%;
    background:#2563eb;
    transition: width 0.15s linear;
  }

  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
    margin-top: 5px;
    flex-wrap: wrap;
  }
  .stat {
    background:#f9fafb;
    border-radius:999px;
    padding:8px 14px;
    display:flex;
    flex-direction:column;
    min-width:130px;
  }
  .stat-label {
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#9ca3af;
  }
  .stat-value {
    font-size: 18px;
    font-weight: 700;
    margin-top: 2px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  table th, table td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: center;
    vertical-align: middle;
    font-size: 14px;
  }
  table th {
    background:#f3f4f6;
    font-weight:600;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  table tr:nth-child(even) {
    background-color: #f9fafb;
  }
  table tr:hover td {
    background-color: #eef2ff;
  }
  table th:nth-child(2),
  table td:nth-child(2) {
    text-align: left;
  }
  /* numeric alignment for size column (4th data column) */
  td:nth-child(4) {
    text-align: right;
  }

  .file-icon {
    margin-right:6px;
  }

  button {
    padding: 7px 14px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: white;
    font-size:13px;
    font-weight:500;
    box-shadow: 0 2px 4px rgba(15,23,42,0.15);
    transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.08s ease;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 8px rgba(15,23,42,0.18);
    opacity:0.95;
  }
  button:active {
    transform: translateY(0);
    box-shadow: 0 1px 3px rgba(15,23,42,0.2);
    opacity:0.9;
  }

  .btn-download { background:#28a745; }
  .btn-delete   { background:#dc3545; }
  .btn-share    { background:#17a2b8; }
  .btn-logout   { background:#3571e2; margin-top:15px; }

  .btn-delete-selected {
    background:#ef4444;
    margin-bottom:10px;
    margin-top:4px;
    display:none; /* hidden until something is selected */
  }

  .actions-cell {
    display:flex;
    justify-content:center;
    gap:8px;
  }

  .share-status {
    font-size: 12px;
    color:#6b7280;
  }
  .share-status.active {
    color:#16a34a;
    font-weight:600;
  }
  .share-status.expired {
    color:#dc2626;
  }
</style>

</head>
<body>
  <div class="card">
    <h2>My Files</h2>
    <p>Files uploaded to your secure CloudSafe Vault</p>

    <!-- Dashboard stats: storage used + active links -->
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Storage used</div>
        <div class="stat-value" id="storageUsed">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Active share links</div>
        <div class="stat-value" id="activeLinks">0</div>
      </div>
    </div>

    <!-- Upload status / progress -->
    <div id="uploadStatus" class="upload-status" style="display:none;">
      <span id="uploadText">Preparing upload…</span>
      <div class="progress-bar">
        <div id="uploadProgress" class="progress-fill"></div>
      </div>
    </div>

    <!-- Upload area -->
    <div class="upload-box">
      <div>
        <strong>Upload new files</strong><br>
        <small>Select one or more files, then click Upload.</small>
      </div>
      <input type="file" id="fileInput" multiple>
      <button class="btn-upload" onclick="uploadFiles()">Upload</button>
    </div>

    <!-- Bulk delete button (hidden until selection) -->
    <button class="btn-delete-selected" onclick="deleteSelectedFiles()">Delete selected</button>

    <table id="filesTable">
      <tr>
        <th></th>
        <th>File</th>
        <th>Uploaded At</th>
        <th>Size (KB)</th>
        <th>Share link</th>
        <th>Actions</th>
      </tr>
    </table>

    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

<!-- AWS SDK -->
<script src="https://sdk.amazonaws.com/js/aws-sdk-2.1485.0.min.js"></script>

<script>
  const REGION = "ap-south-1";
  const IDENTITY_POOL_ID = "ap-south-1:a8aff72b-18b9-4d5e-b3b0-6fe8209c812a";
  const USER_POOL_ID = "ap-south-1_Km1bp6mE5";
  const BUCKET = "cloudsafevault-data";
  const FILES_TABLE = "CloudSafeVaultFiles";

  AWS.config.region = REGION;

  const idToken = localStorage.getItem("idToken");
  if (!idToken) window.location.href = "index.html";

  AWS.config.credentials = new AWS.CognitoIdentityCredentials({
    IdentityPoolId: IDENTITY_POOL_ID,
    Logins: {
      [`cognito-idp.${REGION}.amazonaws.com/${USER_POOL_ID}`]: idToken
    }
  });

  // helper: choose icon by extension
  function getFileIcon(name) {
    const parts = name.split(".");
    const ext = parts.length > 1 ? parts.pop().toLowerCase() : "";
    if (["png","jpg","jpeg","gif","bmp","svg","webp"].includes(ext)) return "🖼️";
    if (ext === "pdf") return "📕";
    if (["doc","docx","odt","rtf"].includes(ext)) return "📄";
    if (["xls","xlsx","csv"].includes(ext)) return "📊";
    if (["ppt","pptx","key"].includes(ext)) return "📽️";
    if (["zip","rar","7z","tar","gz"].includes(ext)) return "🗜️";
    if (["mp4","mkv","avi","mov","webm"].includes(ext)) return "🎬";
    if (["mp3","wav","ogg","m4a","flac"].includes(ext)) return "🎵";
    return "📁";
  }

  // nicer date formatting
  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString(undefined, {
      year: "numeric",
      month: "short",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  // show/hide the "Delete selected" button based on checkboxes
  function updateDeleteSelectedVisibility() {
    const anyChecked = document.querySelectorAll('.row-select:checked').length > 0;
    const btn = document.querySelector('.btn-delete-selected');
    if (!btn) return;
    btn.style.display = anyChecked ? 'inline-block' : 'none';
  }

  // Load existing files + compute storage + active links
  AWS.config.credentials.get(function () {
    const identityId = AWS.config.credentials.identityId;
    const db = new AWS.DynamoDB.DocumentClient();

    db.query({
      TableName: FILES_TABLE,
      KeyConditionExpression: "ownerId = :id",
      ExpressionAttributeValues: { ":id": identityId }
    }, function (err, data) {
      if (err) {
        console.error("Error loading files:", err);
        return alert("Could not load files!");
      }

      const table = document.getElementById("filesTable");
      const now = new Date();

      let totalBytes = 0;
      let activeLinks = 0;

      data.Items.forEach(item => {
        totalBytes += item.sizeBytes || 0;

        const row = table.insertRow();

        // Select checkbox
        const selectCell = row.insertCell(0);
        selectCell.innerHTML =
          `<input type="checkbox" class="row-select" data-key="${item.objectKey}" onclick="updateDeleteSelectedVisibility()">`;

        // File name + icon
        const fileCell = row.insertCell(1);
        const icon = getFileIcon(item.fileName);
        fileCell.innerHTML = `<span class="file-icon">${icon}</span>${item.fileName}`;

        // Uploaded at
        row.insertCell(2).innerText = formatDate(item.uploadedAt);

        // Size
        row.insertCell(3).innerText = item.sizeBytes
          ? (item.sizeBytes / 1024).toFixed(1)
          : "-";

        // Share status cell
        const shareCell = row.insertCell(4);
        shareCell.className = "share-status";
        // store which file this cell belongs to
        shareCell.dataset.objectKey = item.objectKey;

        if (item.lastShareExpiry) {
          const expiresAt = new Date(item.lastShareExpiry);
          if (expiresAt > now) {
            shareCell.dataset.expiresAt = item.lastShareExpiry;
            shareCell.classList.add("active");
            activeLinks++;
          } else {
            shareCell.innerText = "Expired";
            shareCell.classList.add("expired");
          }
        } else {
          shareCell.innerText = "No active link";
        }

        // Actions
        const act = row.insertCell(5);
        act.className = "actions-cell";
        act.innerHTML = `
          <button class="btn-download" onclick="downloadFile('${item.objectKey}')">Download</button>
          <button class="btn-delete" onclick="deleteFile('${item.objectKey}')">Delete</button>
          <button class="btn-share" onclick="generateShareLink('${item.objectKey}')">Share</button>
        `;
      });

      // Empty-state message if no files
      if (!data.Items.length) {
        const row = table.insertRow();
        const cell = row.insertCell(0);
        cell.colSpan = 6;
        cell.style.textAlign = "center";
        cell.style.padding = "20px";
        cell.style.color = "#9ca3af";
        cell.textContent = "No files yet. Upload your first file to get started.";
      }

      // Update dashboard stats
      const storageElem = document.getElementById("storageUsed");
      if (totalBytes < 1024 * 1024) {
        storageElem.textContent = (totalBytes / 1024).toFixed(1) + " KB";
      } else {
        storageElem.textContent = (totalBytes / (1024 * 1024)).toFixed(2) + " MB";
      }
      document.getElementById("activeLinks").textContent = activeLinks.toString();

      startShareCountdowns();
    });
  });

  // countdown for active share links + live badge update
  function startShareCountdowns() {
    function update() {
      const now = new Date();

      // Update each active cell
      const cells = document.querySelectorAll('td.share-status[data-expires-at]');
      cells.forEach(cell => {
        const expStr = cell.dataset.expiresAt;
        const exp = new Date(expStr);
        const diffMs = exp - now;
        if (diffMs <= 0) {
          cell.textContent = "Expired";
          cell.classList.remove("active");
          cell.classList.add("expired");
          cell.removeAttribute("data-expires-at");
          return;
        }
        const totalSec = Math.floor(diffMs / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        let label = "";
        if (h > 0) label += h + "h ";
        label += m.toString().padStart(2,"0") + "m " + s.toString().padStart(2,"0") + "s";
        cell.textContent = "Expires in " + label;
      });

      // Recalculate active links count from DOM
      const activeCount = document.querySelectorAll('td.share-status[data-expires-at]').length;
      document.getElementById("activeLinks").textContent = activeCount.toString();
    }

    update();
    setInterval(update, 1000);
  }

  // MULTI-FILE UPLOAD with real-time progress bar
  function uploadFiles() {
    const input = document.getElementById("fileInput");
    const files = input.files;

    if (!files.length) {
      alert("Please select at least one file.");
      return;
    }

    const statusBox = document.getElementById("uploadStatus");
    const progressFill = document.getElementById("uploadProgress");
    const progressText = document.getElementById("uploadText");

    function setProgress(pct, text) {
      progressFill.style.width = pct + "%";
      progressText.textContent = text;
    }

    statusBox.style.display = "block";
    setProgress(0, `Uploading files... 0%`);

    AWS.config.credentials.get(function (err) {
      if (err) {
        console.error("Cred error:", err);
        alert("Could not get credentials.");
        statusBox.style.display = "none";
        return;
      }

      const identityId = AWS.config.credentials.identityId;
      const s3 = new AWS.S3();
      const db = new AWS.DynamoDB.DocumentClient();

      const uploads = [];
      let completed = 0;

      // total size of all files for overall percentage
      let totalBytes = 0;
      Array.from(files).forEach(f => { totalBytes += f.size || 0; });
      const uploadedPerFile = new Array(files.length).fill(0);

      Array.from(files).forEach((file, index) => {
        const objectKey = `${identityId}/${Date.now()}_${index}_${file.name}`;

        const s3Params = {
          Bucket: BUCKET,
          Key: objectKey,
          Body: file,
          ContentType: file.type || "application/octet-stream"
        };

        const uploader = s3.upload(s3Params);

        // real-time progress
        uploader.on("httpUploadProgress", function (evt) {
          if (typeof evt.loaded === "number") {
            uploadedPerFile[index] = evt.loaded;
            const totalUploaded = uploadedPerFile.reduce((a, b) => a + b, 0);
            const pct = totalBytes
              ? Math.min(100, Math.round((totalUploaded / totalBytes) * 100))
              : 0;
            setProgress(pct, `Uploading files... ${pct}%`);
          }
        });

        const uploadPromise = uploader.promise()
          .then(() => {
            const dbParams = {
              TableName: FILES_TABLE,
              Item: {
                ownerId: identityId,
                objectKey: objectKey,
                fileName: file.name,
                uploadedAt: new Date().toISOString(),
                sizeBytes: file.size
              }
            };
            return db.put(dbParams).promise();
          })
          .then(() => {
            completed++;
            const pct = Math.round((completed / files.length) * 100);
            setProgress(pct, `Finishing uploads... ${pct}%`);
          });

        uploads.push(uploadPromise);
      });

      Promise.all(uploads)
        .then(() => {
          setProgress(100, "Upload complete");
          alert("All files uploaded successfully!");
          window.location.reload();
        })
        .catch(e => {
          console.error("Upload error:", e);
          alert("Some files failed to upload. Check console.");
        });
    });
  }

  // DOWNLOAD
  function downloadFile(key) {
    const s3 = new AWS.S3();
    s3.getSignedUrl('getObject', {
      Bucket: BUCKET,
      Key: key,
      Expires: 60
    }, function (err, url) {
      if (err) {
        console.error("Download error:", err);
        return alert("Error downloading");
      }
      window.open(url, "_blank");
    });
  }

  // SHARE (pre-signed URL, copy to clipboard, track expiry, live counter)
  function generateShareLink(key) {
    const defaultMinutes = 60;
    const input = prompt(
      "Enter link validity in minutes (1–1440, default 60):",
      defaultMinutes.toString()
    );

    if (input === null) return;

    let minutes = defaultMinutes;
    if (input.trim() !== "") {
      const parsed = parseInt(input.trim(), 10);
      if (!isNaN(parsed) && parsed >= 1 && parsed <= 1440) {
        minutes = parsed;
      } else {
        alert("Invalid value, using default 60 minutes.");
      }
    }

    const expiresSeconds = minutes * 60;
    const expiresAt = new Date(Date.now() + expiresSeconds * 1000).toISOString();

    const s3 = new AWS.S3();
    s3.getSignedUrl('getObject', {
      Bucket: BUCKET,
      Key: key,
      Expires: expiresSeconds
    }, function (err, url) {
      if (err) {
        console.error("Error generating share link:", err);
        return alert("Error generating share link");
      }

      // Save expiry in DynamoDB
      const db = new AWS.DynamoDB.DocumentClient();
      const identityId = AWS.config.credentials.identityId;

      db.update({
        TableName: FILES_TABLE,
        Key: { ownerId: identityId, objectKey: key },
        UpdateExpression: "SET lastShareExpiry = :exp",
        ExpressionAttributeValues: { ":exp": expiresAt }
      }, function (updateErr) {
        if (updateErr) {
          console.error("Error updating lastShareExpiry:", updateErr);
        }

        // Update the "Share link" cell for this file
        const cells = document.querySelectorAll('td.share-status');
        let wasActive = false;
        cells.forEach(cell => {
          if (cell.dataset.objectKey === key) {
            if (cell.dataset.expiresAt) {
              wasActive = true; // already had an active link
            }
            cell.dataset.expiresAt = expiresAt;
            cell.classList.remove("expired");
            cell.classList.add("active");
            cell.textContent = "Expires soon…";
          }
        });

        // Increment Active share links stat if this is a new active link
        if (!wasActive) {
          const activeElem = document.getElementById("activeLinks");
          const current = parseInt(activeElem.textContent || "0", 10);
          activeElem.textContent = (current + 1).toString();
        }

        // Try to copy to clipboard (no reload)
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url)
            .then(() => {
              alert("Share link copied to clipboard!");
            })
            .catch(() => {
              alert("Here is your share link (copy it):\n" + url);
            });
        } else {
          // Fallback
          alert("Here is your share link (copy it):\n" + url);
        }
      });
    });
  }

  // DELETE single file
  function deleteFile(key) {
    console.log("deleteFile called for key:", key);

    if (!confirm("Delete this file?")) return;

    const s3 = new AWS.S3();
    s3.deleteObject({ Bucket: BUCKET, Key: key }, function (err) {
      if (err) {
        console.error("S3 delete error:", err);
        return alert("Delete failed (S3): " + (err.message || "Unknown error"));
      }

      const db = new AWS.DynamoDB.DocumentClient();
      const identityId = AWS.config.credentials.identityId;
      console.log("Deleting from DynamoDB with key:", {
        ownerId: identityId,
        objectKey: key
      });

      db.delete(
        {
          TableName: FILES_TABLE,
          Key: { ownerId: identityId, objectKey: key }
        },
        function (dbErr, data) {
          if (dbErr) {
            console.error("DynamoDB delete error:", dbErr);
            return alert("Delete failed (DB): " + (dbErr.message || "Unknown error"));
          }
          console.log("DynamoDB delete success:", data);
          alert("Deleted!");
          location.reload();
        }
      );
    });
  }

  // DELETE multiple selected files (no BatchWriteItem; uses DeleteItem)
  function deleteSelectedFiles() {
    const checkboxes = document.querySelectorAll('.row-select:checked');
    if (!checkboxes.length) {
      alert("Please select at least one file.");
      return;
    }

    if (!confirm(`Delete ${checkboxes.length} selected file(s)?`)) return;

    AWS.config.credentials.get(function (err) {
      if (err) {
        console.error("Cred error:", err);
        alert("Could not get credentials.");
        return;
      }

      const identityId = AWS.config.credentials.identityId;
      const keys = Array.from(checkboxes).map(cb => cb.dataset.key);

      const s3 = new AWS.S3();
      const deleteParams = {
        Bucket: BUCKET,
        Delete: {
          Objects: keys.map(k => ({ Key: k }))
        }
      };

      s3.deleteObjects(deleteParams, function (s3Err, data) {
        if (s3Err) {
          console.error("S3 multi-delete error:", s3Err);
          return alert("Delete failed (S3): " + (s3Err.message || "Unknown error"));
        }

        const db = new AWS.DynamoDB.DocumentClient();

        // one DeleteItem per key (allowed by your current policy)
        const deletePromises = keys.map(k =>
          db.delete({
            TableName: FILES_TABLE,
            Key: { ownerId: identityId, objectKey: k }
          }).promise()
        );

        Promise.all(deletePromises)
          .then(() => {
            alert("Selected files deleted!");
            window.location.reload();
          })
          .catch(dbErr => {
            console.error("DynamoDB multi-delete error:", dbErr);
            alert("Delete failed (DB): " + (dbErr.message || "Unknown error"));
          });
      });
    });
  }

  function logout() {
    localStorage.removeItem("idToken");
    window.location.href = "index.html";
  }
</script>

</body>
</html>
