    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top right, #f8e9ff, #e3f0ff 40%, #fdfdff 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
      padding: 40px 52px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111827;
    }

    .accent {
      color: #2563eb;
    }

    p.subtitle {
      font-size: 15px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    button.primary {
      border: none;
      border-radius: 999px;
      padding: 12px 32px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    button.primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.45);
    }

    button.primary:active {
      transform: translateY(0);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    button.primary:focus-visible {
      outline: 2px solid #1d4ed8;
      outline-offset: 3px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.08);
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.25);
    }

    .pill-icon {
      width: 14px;
      height: 14px;
    }

    .secondary-text {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 16px;
    }

    .secondary-text strong { color: #4b5563; }

    .trust-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 20px;
      margin-top: 18px;
      font-size: 11px;
      color: #6b7280;
    }

    .trust-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .trust-bullet {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #d1d5db;
    }

    .creator-bottom {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #c0c6d2;
      opacity: 0.85;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .card {
        padding: 28px 20px 24px;
      }
      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
